services:
  - type: web
    name: vivora-api
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: VIVORA_LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
